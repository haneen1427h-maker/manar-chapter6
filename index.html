<!DOCTYPE html>  
<html lang="ar" dir="rtl">  
<head>  
<meta charset="utf-8">  
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">  
<title>ملف المهمة</title>  
<style>  
/* ========================= الألوان الأساسية ========================= */  
:root{  
    box-sizing:border-box;  
    padding-top:env(safe-area-inset-top,0px);  
    padding-bottom:env(safe-area-inset-bottom,0px);  
    --bg:#fff;  
    --ink:#2d4a7a;  
    --card:#f4f8fd;  
    --line:#b7c9e4;  
    --chip:#cfdcf2;  
    --ic:#dfe8e0;  
    --head1:#3a5c92;  
    --head2:#fff;  
}  
/* ========================= الإعدادات العامة ========================= */  
*{  
    box-sizing:border-box;  
}  
html{  
    scroll-padding-top:env(safe-area-inset-top,0px);  
}  
body{  
    margin:0;  
    background:var(--bg);  
    color:var(--ink);  
    font-family: "Tajawal", "Segoe UI", Tahoma, sans-serif;  
}  
/* ========================= Header ========================= */  
header{  
    background: linear-gradient( var(--head1), var(--head2) );  
    padding:28px 20px 40px;  
    text-align:center;  
}  
.top{  
    display:flex;  
    justify-content:space-between;  
    align-items:center;  
    max-width:960px;  
    margin:0 auto;  
    direction:ltr;  
    gap:12px;  
    flex-wrap:wrap;  
}  
.big{  
    font-size:clamp(28px,6vw,52px);  
    font-weight:900;  
    color:#1c2f57;  
    line-height:1;  
    text-align:left;  
    font-family: Impact, "Arial Black", sans-serif;  
    letter-spacing:1px;  
}  
.big span{  
    display:inline-block;  
    background:#bcd0f0;  
    padding:4px 14px;  
    font-size:.45em;  
    margin-top:6px;  
    font-family:Arial,sans-serif;  
    letter-spacing:2px;  
}  
.logos{  
    font-weight:700;  
    font-size:14px;  
    text-align:center;  
    color:#1c2f57;  
    border:2px dashed var(--line);  
    padding:10px 14px;  
    border-radius:12px;  
}  
.title{  
    display:inline-block;  
    margin-top:20px;  
    background:#fbf4e6;  
    color:#2d4a7a;  
    padding:8px 26px;  
    border-radius:12px;  
    font-weight:800;  
    font-size:20px;  
}  
/* ========================= بطاقات المهام ========================= */  
main{  
    max-width:960px;  
    margin:-10px auto 0;  
    padding:20px 14px 40px;  
    display:grid;  
    grid-template-columns: repeat( auto-fit, minmax(300px,1fr) );  
    gap:22px;  
}  
.card{  
    position:relative;  
    background:var(--card);  
    border:1.5px solid var(--line);  
    border-radius: 6px 24px 6px 6px;  
    padding:30px 12px 12px;  
}  
.tag{  
    position:absolute;  
    top:-12px;  
    left:14px;  
    direction:ltr;  
    background:var(--bg);  
    border:2px solid var(--ink);  
    padding:1px 10px;  
    font-weight:800;  
    font-size:13px;  
    transform:rotate(-4deg);  
    font-family:Arial,sans-serif;  
}  
.row{  
    display:flex;  
    align-items:center;  
    gap:10px;  
    margin-bottom:10px;  
}  
.ic{  
    flex:none;  
    width:40px;  
    height:40px;  
    border-radius:50%;  
    background:var(--ic);  
    display:grid;  
    place-items:center;  
    font-size:18px;  
}  
.f{  
    flex:1;  
    position:relative;  
    background:var(--bg);  
    border:1px solid var(--line);  
    border-radius:10px;  
    padding:18px 12px 8px;  
    min-height:50px;  
    font-size:14px;  
    border-bottom: 1px dashed var(--line);  
}  
.f b{  
    position:absolute;  
    top:-9px;  
    right:10px;  
    background:var(--chip);  
    color:var(--ink);  
    font-size:11px;  
    padding:1px 10px;  
    border-radius:6px;  
}  
.f input{  
    width:100%;  
    border:0;  
    background:transparent;  
    color:var(--ink);  
    font:inherit;  
    font-size:14px;  
    outline:none;  
    padding:0;  
}  
.dl{  
    grid-column:1/-1;  
    max-width:420px;  
    margin:0 auto;  
    width:100%;  
}  
#st{  
    text-align:center;  
    font-size:12px;  
    opacity:.7;  
    padding-bottom:20px;  
}  
/* ========================= قسم استلام المهام ========================= */  
.assignment{  
    max-width:900px;  
    margin: 10px auto 50px;  
    padding:25px 18px;  
    background:var(--card);  
    border:1.5px solid var(--line);  
    border-radius:20px;  
}  
.assignment-title{  
    text-align:center;  
    margin:0 0 8px;  
    font-size:22px;  
}  
.assignment-subtitle{  
    text-align:center;  
    font-size:14px;  
    opacity:.75;  
    margin-bottom:22px;  
}  
.assignment-box{  
    display:flex;  
    justify-content:center;  
    align-items:center;  
    gap:10px;  
    flex-wrap:wrap;  
}  
.assignment-box select, .assignment-box input{  
    padding:12px;  
    border:1px solid var(--line);  
    border-radius:10px;  
    background:var(--bg);  
    color:var(--ink);  
    font-family:inherit;  
    outline:none;  
}  
.assignment-box select{  
    min-width:250px;  
}  
.assignment-box input{  
    width:200px;  
}  
.assign-btn{  
    padding:12px 20px;  
    border:0;  
    border-radius:10px;  
    background:#3a5c92;  
    color:white;  
    font-family:inherit;  
    font-weight:700;  
    cursor:pointer;  
}  
.assign-btn:hover{  
    opacity:.9;  
}  
#message{  
    text-align:center;  
    margin-top:15px;  
    font-size:14px;  
    font-weight:700;  
}  
.mission-results{  
    margin-top:25px;  
    display:grid;  
    grid-template-columns: repeat( auto-fit, minmax(250px,1fr) );  
    gap:12px;  
}  
.mission-result{  
    background:var(--bg);  
    border:1px solid var(--line);  
    border-radius:12px;  
    padding:14px;  
}  
.mission-result strong{  
    display:block;  
    margin-bottom:6px;  
}  
.available{  
    color:#6c8f68;  
    font-size:13px;  
}  
.taken{  
    color:#3a5c92;  
    font-weight:700;  
}  
/* ========================= الجوال ========================= */  
@media(max-width:600px){  
    main{  
        grid-template-columns:1fr;  
    }  
    .assignment-box{  
        flex-direction:column;  
    }  
    .assignment-box select, .assignment-box input, .assign-btn{  
        width:100%;  
        max-width:350px;  
    }  
}  
</style>  
</head>  
<body>  

<!-- ========================= Header ========================= -->  
<header>  
    <div class="top">  
        <div class="logos">  
            <span style="color:#bcd0f0;"> مَنار العِلم EL MANAR </span>  
        </div>  
        <div class="big">  
            CONFIDENTIAL <br>  
            <span> TEAM MISSION </span>  
        </div>  
    </div>  
    <div class="title"> ☆ ملف المهمة ☆ </div>  
</header>  

<!-- ========================= بطاقات المهام ========================= -->  
<main id="m"></main>  
<div id="st"></div>  

<!-- ========================= استلام المهمة ========================= -->  
<section class="assignment">  
    <h2 class="assignment-title"> 🎯 استلام المهمة </h2>  
    <div class="assignment-subtitle"> اختار/ي المهمة المناسبة لك واكتب/ي اسمك لاستلامها 🤍 </div>  

    <div class="assignment-box">  
        <!-- اختيار المهمة -->  
        <select id="missionSelect">  
            <option value=""> اختاري المهمة </option>  
            <option value="شرح الشابتر السادس"> شرح الشابتر السادس </option>  
            <option value="ملخص الشابتر السادس"> ملخص الشابتر السادس </option>  
            <option value="كويز الشابتر السادس"> كويز الشابتر السادس </option>  
            <option value="تدقيق شرح الشابتر السادس"> تدقيق شرح الشابتر السادس </option>  
            <option value="تدقيق ملخص الشابتر السادس"> تدقيق ملخص الشابتر السادس </option>  
            <option value="تدقيق كويز الشابتر السادس"> تدقيق كويز الشابتر السادس </option>  
        </select>  

        <!-- اسم العضو -->  
        <input type="text" id="assignName" maxlength="50" placeholder="اكتب/ي اسمك هنا">  

        <!-- زر الاستلام -->  
        <button class="assign-btn" onclick="assignMission()"> استلام المهمة </button>  
    </div>  

    <!-- رسالة الحالة -->  
    <div id="message"></div>  

    <!-- عرض المهام -->  
    <div id="missionsList" class="mission-results"></div>
</section>  

<!-- ========================= سكربت الجافاسكربت و Firebase ========================= -->  
<script type="module">  
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";  
  import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";  

  // إعدادات قاعدة البيانات الجديدة (manar-team6)
  const firebaseConfig = {
    apiKey: "AIzaSyBM_DqD4xykv29d-QI0nHZHNYMHNGCd0vA",
    authDomain: "manar-team6.firebaseapp.com",
    projectId: "manar-team6",
    storageBucket: "manar-team6.firebasestorage.app",
    messagingSenderId: "28443243225",
    appId: "1:28443243225:web:abdad0d51c8f8bfafa04c8",
    measurementId: "G-4QPKG9XJ2S"
  };

  // تهيئة Firebase
  const app = initializeApp(firebaseConfig);  
  const db = getFirestore(app);  

  /* ===================================================== أسماء المهام ===================================================== */  
  const missionDetails = [  
      "شرح الشابتر السادس",  
      "ملخص الشابتر السادس",  
      "كويز الشابتر السادس",  
      "تدقيق شرح الشابتر السادس",  
      "تدقيق ملخص الشابتر السادس",  
      "تدقيق كويز الشابتر السادس"  
  ];  
    
  /* ===================================================== إنشاء بطاقات المهام ===================================================== */  
  let h = "";  
  for(let i = 1; i <= 6; i++){  
      h += `  
      <section class="card">  
          <div class="tag"> MISSION #0${i} </div>  
          <div class="row">  
              <div class="ic"> 🎯 </div>  
              <div class="f">  
                  <b> رقم المهمة: </b>  
                  <div> #0${i} </div>  
              </div>  
          </div>  
          <div class="row">  
              <div class="ic"> 📝 </div>  
              <div class="f">  
                  <b> المطلوب: </b>  
                  <div> ${missionDetails[i-1]} </div>  
              </div>  
          </div>  
          <div class="row">  
              <div class="ic"> 👤 </div>  
              <div class="f">  
                  <b> المسؤول: </b>  
                  <input type="text" id="missionPerson${i}" placeholder="سيظهر اسم المسؤول هنا" readonly>  
              </div>  
          </div>  
      </section>  
      `;  
  }  
    
  /* بطاقة الموعد النهائي */  
  h += `  
  <section class="card dl">  
      <div class="tag"> DEADLINE </div>  
      <div class="row">  
          <div class="ic"> ⏰ </div>  
          <div class="f">  
              <b> الموعد النهائي: </b>  
              <input type="text" value="20 - 5 - 1448 هـ | 31 - 10 - 2026 م" readonly>  
          </div>  
      </div>  
  </section>  
  `;  
    
  document.getElementById("m").innerHTML = h;  

  /* ===================================================== استلام المهمة (Firebase) ===================================================== */  
  window.assignMission = async function() {  
      const mission = document.getElementById("missionSelect").value.trim();  
      const name = document.getElementById("assignName").value.trim();  
      const message = document.getElementById("message");  

      if(!mission){  
          message.textContent = "⚠️ اختاري المهمة أولاً.";  
          return;  
      }  

      if(!name){  
          message.textContent = "⚠️ اكتبي اسمك أولاً.";  
          return;  
      }  

      message.textContent = "⏳ جاري تسجيل المهمة في قاعدة البيانات...";  

      try {  
          const querySnapshot = await getDocs(collection(db, "missions"));  
          let alreadyTaken = false;  

          querySnapshot.forEach((doc) => {  
              const data = doc.data();  
              if(data.mission && data.mission.trim() === mission){  
                  alreadyTaken = true;  
              }  
          });  

          if(alreadyTaken){  
              message.textContent = "⚠️ هذه المهمة تم استلامها مسبقًا.";  
              loadMissions();  
              return;  
          }  

          await addDoc(collection(db, "missions"), {  
              mission: mission,  
              name: name,  
              timestamp: new Date()  
          });  

          message.textContent = "✅ تم تسجيل اسمك واستلام المهمة بنجاح!";  
          document.getElementById("assignName").value = "";  
          document.getElementById("missionSelect").value = "";  

          loadMissions();  
      } catch (error) {  
          console.error("خطأ أثناء الحفظ:", error);  
          message.textContent = "❌ حدث خطأ أثناء الحفظ، تأكدي من الاتصال بـ Firebase.";  
      }  
  };  

  /* ===================================================== تحميل البيانات من Firestore ===================================================== */  
  async function loadMissions(){  
      try {  
          const querySnapshot = await getDocs(collection(db, "missions"));  
          const data = [];  
          querySnapshot.forEach((doc) => {  
              data.push(doc.data());  
          });  

          const list = document.getElementById("missionsList");  
          list.innerHTML = "";  

          missionDetails.forEach(function(mission, index){  
              const row = data.find(function(item){  
                  return item.mission && item.mission.trim() === mission && item.name && item.name.trim();  
              });  

              const div = document.createElement("div");  
              div.className = "mission-result";  

              if(row){  
                  div.innerHTML = `  
                      <strong> 📌 ${mission} </strong>  
                      <span class="taken"> 👤 المسؤول: ${row.name} </span>  
                  `;  
              } else {  
                  div.innerHTML = `  
                      <strong> 📌 ${mission} </strong>  
                      <span class="available"> ✓ المهمة متاحة للاستلام </span>  
                  `;  
              }  
              list.appendChild(div);  

              const personInput = document.getElementById("missionPerson" + (index + 1));  
              if(personInput){  
                  if(row){  
                      personInput.value = row.name;  
                  } else {  
                      personInput.value = "لم يتم استلام المهمة بعد";  
                  }  
              }  
          });  
      } catch (error) {  
          console.error("خطأ أثناء تحميل البيانات:", error);  
      }  
  }  

  window.addEventListener("load", loadMissions);  
</script>  

</body>  
</html>
